# Sized for the free tier: about 3,000 queries, so the large model's 1,000 requests/day
# limit gets through a full run in about 3 days. With a paid API, raise gsm8k_train to 2000
# and mmlu_per_subject to 70 (about 7,300 queries, as in the implementation doc).
seed: 42
gsm8k_test: all        # 1,319 questions
gsm8k_train: 0
mmlu_per_subject: 30   # 57 subjects -> 1,710 questions
pilot_per_dataset: 100 # pilot draws from the train split only
split:
  train: 0.6
  val: 0.2
  test: 0.2
